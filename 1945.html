<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Push 4 Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#5D5CDE',
                        player1: '#FF5757',
                        player2: '#FFDD57',
                        computer: '#57C7FF',
                    }
                }
            },
            darkMode: 'class',
        }
    </script>
    <style>
        .board-cell {
            transition: all 0.3s ease;
        }
        .piece {
            transition: transform 0.6s cubic-bezier(0.5, 0, 0.75, 0.9);
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(10%);}
            60% {transform: translateY(5%);}
        }
        .winner-piece {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .dark .board {
            background-color: #2D2D2D;
        }
        .dark .board-cell {
            background-color: #181818;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300">
    <div class="container mx-auto px-4 py-8 max-w-lg">
        <h1 class="text-3xl font-bold text-center mb-6 text-primary">Push 4</h1>

        <!-- Game Mode Selection -->
        <div id="game-mode-selector" class="mb-6">
            <h2 class="text-xl font-semibold mb-3 text-center">Select Game Mode</h2>
            <div class="flex gap-4 justify-center">
                <button id="single-player-btn" class="px-4 py-2 rounded-lg bg-primary text-white font-medium hover:bg-opacity-90 transition-colors">
                    Single Player
                </button>
                <button id="two-player-btn" class="px-4 py-2 rounded-lg bg-primary text-white font-medium hover:bg-opacity-90 transition-colors">
                    Two Players
                </button>
            </div>
        </div>

        <!-- Game Status -->
        <div id="game-status" class="mb-4 text-center font-medium text-lg hidden">
            <span id="status-message">Player 1's Turn</span>
        </div>

        <!-- Game Board -->
        <div id="game-container" class="hidden">
            <div id="board" class="board bg-blue-600 dark:bg-blue-800 p-2 rounded-lg shadow-lg mb-4">
                <div id="game-grid" class="grid grid-cols-7 gap-2">
                    <!-- Columns will be generated by JavaScript -->
                </div>
            </div>

            <!-- Game Controls -->
            <div class="flex justify-center">
                <button id="restart-btn" class="px-4 py-2 rounded-lg bg-primary text-white font-medium hover:bg-opacity-90 transition-colors">
                    New Game
                </button>
                <button id="change-mode-btn" class="ml-3 px-4 py-2 rounded-lg bg-gray-500 text-white font-medium hover:bg-opacity-90 transition-colors">
                    Change Mode
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Check for dark mode preference
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            }
            
            // Listen for changes in color scheme preference
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
                if (event.matches) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            });

            const gameModeSelector = document.getElementById('game-mode-selector');
            const gameContainer = document.getElementById('game-container');
            const gameStatus = document.getElementById('game-status');
            const statusMessage = document.getElementById('status-message');
            const gameGrid = document.getElementById('game-grid');
            const singlePlayerBtn = document.getElementById('single-player-btn');
            const twoPlayerBtn = document.getElementById('two-player-btn');
            const restartBtn = document.getElementById('restart-btn');
            const changeModeBtn = document.getElementById('change-mode-btn');

            // Game constants
            const ROWS = 6;
            const COLS = 7;
            const EMPTY = 0;
            const PLAYER1 = 1;
            const PLAYER2 = 2;
            const COMPUTER = 3;

            // Game state
            let gameMode = null; // 'single' or 'two'
            let currentPlayer = PLAYER1;
            let gameBoard = [];
            let gameOver = false;
            let winningCells = [];

            // Initialize board
            function initializeBoard() {
                gameBoard = Array(ROWS).fill().map(() => Array(COLS).fill(EMPTY));
                gameGrid.innerHTML = '';
                
                // Create column buttons (upside down)
                for (let col = 0; col < COLS; col++) {
                    const column = document.createElement('div');
                    column.className = 'flex flex-col'; // Changed from flex-col-reverse to flex-col
                    column.dataset.col = col;
                    
                    for (let row = 0; row < ROWS; row++) {
                        const cell = document.createElement('div');
                        cell.className = 'board-cell w-full aspect-square rounded-full bg-white dark:bg-gray-800 shadow-inner flex items-center justify-center';
                        cell.dataset.row = row;
                        cell.dataset.col = col;
                        column.appendChild(cell);
                    }
                    
                    gameGrid.appendChild(column);
                }

                gameGrid.addEventListener('click', handleColumnClick);
                updateGameStatus();
            }

            // Handle column click
            function handleColumnClick(e) {
                if (gameOver) return;
                
                // If it's computer's turn in single player mode, ignore clicks
                if (gameMode === 'single' && currentPlayer === COMPUTER) return;
                
                const column = e.target.closest('div[data-col]');
                if (!column) return;
                
                const col = parseInt(column.dataset.col);
                makeMove(col);
            }

            // Make a move in the specified column
            function makeMove(col) {
                // Find the highest empty row in the column
                let row = getLowestEmptyRow(col);
                
                // If column is full, do nothing
                if (row === -1) return;
                
                // Place the piece and update the board
                gameBoard[row][col] = currentPlayer;
                animatePiece(row, col, currentPlayer);
                
                // Check for win
                if (checkWin(row, col, currentPlayer)) {
                    highlightWinningCells();
                    gameOver = true;
                    
                    let winMessage = '';
                    if (currentPlayer === PLAYER1) {
                        winMessage = 'Player 1 Wins!';
                    } else if (currentPlayer === PLAYER2) {
                        winMessage = 'Player 2 Wins!';
                    } else {
                        winMessage = 'Computer Wins!';
                    }
                    
                    statusMessage.textContent = winMessage;
                    return;
                }
                
                // Check for draw
                if (isBoardFull()) {
                    gameOver = true;
                    statusMessage.textContent = 'Game Draw!';
                    return;
                }
                
                // Switch players
                if (gameMode === 'single') {
                    if (currentPlayer === PLAYER1) {
                        currentPlayer = COMPUTER;
                        updateGameStatus();
                        setTimeout(makeComputerMove, 750); // Delay computer move for better UX
                    } else {
                        currentPlayer = PLAYER1;
                    }
                } else { // Two-player mode
                    currentPlayer = currentPlayer === PLAYER1 ? PLAYER2 : PLAYER1;
                }
                
                updateGameStatus();
            }

            // Animate the piece rising from below
            function animatePiece(row, col, player) {
                const column = gameGrid.children[col];
                const cell = column.children[row]; // No need to invert row anymore with upside-down board
                
                const piece = document.createElement('div');
                piece.className = 'piece absolute w-[80%] h-[80%] rounded-full';
                
                if (player === PLAYER1) {
                    piece.classList.add('bg-player1');
                } else if (player === PLAYER2) {
                    piece.classList.add('bg-player2');
                } else { // Computer
                    piece.classList.add('bg-computer');
                }
                
                // Start from below the board
                const cellHeight = cell.offsetHeight;
                const startY = (ROWS * -cellHeight);
                piece.style.transform = `translateY(${startY}px)`;
                
                cell.style.position = 'relative';
                cell.appendChild(piece);
                
                // Animate the piece rising
                setTimeout(() => {
                    piece.style.transform = 'translateY(0)';
                    
                    // Add bounce animation after the piece arrives
                    piece.addEventListener('transitionend', function onTransitionEnd() {
                        piece.style.animation = 'bounce 0.5s ease';
                        piece.removeEventListener('transitionend', onTransitionEnd);
                    });
                }, 50);
            }

            // Computer move algorithm
            function makeComputerMove() {
                if (gameOver) return;
                
                // First check if computer can win in the next move
                for (let col = 0; col < COLS; col++) {
                    let row = getLowestEmptyRow(col);
                    if (row !== -1) {
                        gameBoard[row][col] = COMPUTER;
                        if (checkWin(row, col, COMPUTER)) {
                            gameBoard[row][col] = EMPTY; // Reset for actual move
                            makeMove(col);
                            return;
                        }
                        gameBoard[row][col] = EMPTY; // Reset after checking
                    }
                }
                
                // Then check if player can win in the next move and block
                for (let col = 0; col < COLS; col++) {
                    let row = getLowestEmptyRow(col);
                    if (row !== -1) {
                        gameBoard[row][col] = PLAYER1;
                        if (checkWin(row, col, PLAYER1)) {
                            gameBoard[row][col] = EMPTY; // Reset for actual move
                            makeMove(col);
                            return;
                        }
                        gameBoard[row][col] = EMPTY; // Reset after checking
                    }
                }
                
                // Otherwise, prefer the center column
                let centerCol = 3;
                if (getLowestEmptyRow(centerCol) !== -1) {
                    makeMove(centerCol);
                    return;
                }
                
                // If center is full, choose a random valid column
                let validCols = [];
                for (let col = 0; col < COLS; col++) {
                    if (getLowestEmptyRow(col) !== -1) {
                        validCols.push(col);
                    }
                }
                
                if (validCols.length > 0) {
                    const randomCol = validCols[Math.floor(Math.random() * validCols.length)];
                    makeMove(randomCol);
                }
            }

            // Get the highest empty row in a column (since we're inverted)
            function getLowestEmptyRow(col) {
                // Start from the top (ROWS-1) and go down
                for (let row = ROWS - 1; row >= 0; row--) {
                    if (gameBoard[row][col] === EMPTY) {
                        return row;
                    }
                }
                return -1; // Column is full
            }

            // Check if the board is full (draw)
            function isBoardFull() {
                for (let col = 0; col < COLS; col++) {
                    if (getLowestEmptyRow(col) !== -1) {
                        return false;
                    }
                }
                return true;
            }

            // Check for a win
            function checkWin(row, col, player) {
                // Check horizontal
                winningCells = [];
                for (let c = Math.max(0, col - 3); c <= Math.min(col, COLS - 4); c++) {
                    if (gameBoard[row][c] === player && 
                        gameBoard[row][c+1] === player && 
                        gameBoard[row][c+2] === player && 
                        gameBoard[row][c+3] === player) {
                        winningCells = [[row, c], [row, c+1], [row, c+2], [row, c+3]];
                        return true;
                    }
                }
                
                // Check vertical
                winningCells = [];
                for (let r = Math.max(0, row - 3); r <= Math.min(row, ROWS - 4); r++) {
                    if (gameBoard[r][col] === player && 
                        gameBoard[r+1][col] === player && 
                        gameBoard[r+2][col] === player && 
                        gameBoard[r+3][col] === player) {
                        winningCells = [[r, col], [r+1, col], [r+2, col], [r+3, col]];
                        return true;
                    }
                }
                
                // Check diagonal up-right
                winningCells = [];
                for (let r = 3; r < ROWS; r++) {
                    for (let c = 0; c < COLS - 3; c++) {
                        if (gameBoard[r][c] === player && 
                            gameBoard[r-1][c+1] === player && 
                            gameBoard[r-2][c+2] === player && 
                            gameBoard[r-3][c+3] === player) {
                            winningCells = [[r, c], [r-1, c+1], [r-2, c+2], [r-3, c+3]];
                            return true;
                        }
                    }
                }
                
                // Check diagonal up-left
                winningCells = [];
                for (let r = 3; r < ROWS; r++) {
                    for (let c = 3; c < COLS; c++) {
                        if (gameBoard[r][c] === player && 
                            gameBoard[r-1][c-1] === player && 
                            gameBoard[r-2][c-2] === player && 
                            gameBoard[r-3][c-3] === player) {
                            winningCells = [[r, c], [r-1, c-1], [r-2, c-2], [r-3, c-3]];
                            return true;
                        }
                    }
                }
                
                return false;
            }

            // Highlight winning cells
            function highlightWinningCells() {
                winningCells.forEach(cell => {
                    const [row, col] = cell;
                    const column = gameGrid.children[col];
                    const cellElement = column.children[row]; // Updated for upside-down board
                    const piece = cellElement.querySelector('.piece');
                    if (piece) {
                        piece.classList.add('winner-piece');
                    }
                });
            }

            // Update game status display
            function updateGameStatus() {
                if (gameOver) return;
                
                if (gameMode === 'single') {
                    statusMessage.textContent = currentPlayer === PLAYER1 ? 
                        'Your Turn' : 'Computer Thinking...';
                } else {
                    statusMessage.textContent = currentPlayer === PLAYER1 ? 
                        'Player 1\'s Turn' : 'Player 2\'s Turn';
                }
            }

            // Start a new game
            function startNewGame() {
                gameOver = false;
                currentPlayer = PLAYER1;
                winningCells = [];
                initializeBoard();
            }

            // Start single player game
            singlePlayerBtn.addEventListener('click', () => {
                gameMode = 'single';
                gameModeSelector.classList.add('hidden');
                gameContainer.classList.remove('hidden');
                gameStatus.classList.remove('hidden');
                startNewGame();
            });

            // Start two player game
            twoPlayerBtn.addEventListener('click', () => {
                gameMode = 'two';
                gameModeSelector.classList.add('hidden');
                gameContainer.classList.remove('hidden');
                gameStatus.classList.remove('hidden');
                startNewGame();
            });

            // Restart game
            restartBtn.addEventListener('click', startNewGame);

            // Change game mode
            changeModeBtn.addEventListener('click', () => {
                gameContainer.classList.add('hidden');
                gameStatus.classList.add('hidden');
                gameModeSelector.classList.remove('hidden');
            });
        });
    </script>
</body>
</html>
